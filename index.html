<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamAr Career Toolkit</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-area { 
                width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                box-shadow: none !important; 
                border: none !important;
            }
            body { background: white !important; }
        }
        .preview-paper {
            min-height: 297mm;
            width: 210mm;
        }
        @media (max-width: 1024px) {
            .preview-paper {
                width: 100%;
                min-height: auto;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 shadow-md no-print flex justify-between items-center flex-wrap gap-2">
        <h1 class="text-2xl font-bold tracking-wide">SamAr <span class="text-indigo-400">Career Toolkit</span></h1>
        <div class="flex items-center gap-2 flex-wrap">
            <button onclick="clearData()" class="bg-rose-600 hover:bg-rose-700 px-3 py-1.5 rounded text-sm font-medium transition">Reset</button>
            <button onclick="exportData()" class="bg-amber-600 hover:bg-amber-700 px-3 py-1.5 rounded text-sm font-medium transition">Export Data</button>
            <label class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-sm font-medium transition cursor-pointer">
                Import Data
                <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
            </label>
            <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded text-sm font-medium transition">Print / Save PDF</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6 p-4 max-w-[1800px] w-full mx-auto">
        
        <!-- Controls & Editor Section -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 no-print space-y-6 overflow-y-auto max-h-[88vh]">
            
            <!-- Tool Switcher & Custom Accent -->
            <div class="flex flex-wrap items-center justify-between gap-4 border-b pb-4">
                <div class="flex bg-slate-100 p-1 rounded-lg gap-1">
                    <button id="btn-resume" onclick="switchTool('resume')" class="px-4 py-2 rounded-md font-semibold text-sm bg-white shadow-sm text-slate-800">Resume Builder</button>
                    <button id="btn-app" onclick="switchTool('app')" class="px-4 py-2 rounded-md font-semibold text-sm text-slate-600 hover:text-slate-900">Application Writer</button>
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-sm font-medium text-slate-600">Accent Color:</label>
                    <input type="color" id="accentColor" value="#4f46e5" oninput="updatePreview()" class="w-8 h-8 rounded cursor-pointer border-0">
                </div>
            </div>

            <!-- RESUME FORM -->
            <div id="form-resume" class="space-y-6">
                <!-- Personal Info -->
                <div class="space-y-3">
                    <h2 class="text-lg font-bold border-b pb-1 text-slate-700">Personal Information</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <input type="text" id="resName" placeholder="Full Name" oninput="updatePreview()" class="p-2 border rounded text-sm">
                        <input type="text" id="resTitle" placeholder="Professional Title" oninput="updatePreview()" class="p-2 border rounded text-sm">
                        <input type="email" id="resEmail" placeholder="Email Address" oninput="updatePreview()" class="p-2 border rounded text-sm">
                        <input type="text" id="resPhone" placeholder="Phone Number" oninput="updatePreview()" class="p-2 border rounded text-sm">
                        <input type="text" id="resLocation" placeholder="Location (City, Country)" oninput="updatePreview()" class="p-2 border rounded text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Profile Photo</label>
                        <input type="file" id="resPhoto" accept="image/*" onchange="handleImageUpload(event, 'photo')" class="text-xs">
                    </div>
                </div>

                <!-- Dynamic Sections -->
                <div class="space-y-3">
                    <h2 class="text-lg font-bold border-b pb-1 text-slate-700">Education</h2>
                    <textarea id="resEducation" rows="3" placeholder="e.g., B.Tech in Computer Science - XYZ University (2020-2024)" oninput="updatePreview()" class="w-full p-2 border rounded text-sm"></textarea>
                </div>

                <div class="space-y-3">
                    <h2 class="text-lg font-bold border-b pb-1 text-slate-700">Experience</h2>
                    <textarea id="resExperience" rows="4" placeholder="e.g., Software Engineer at ABC Tech (2024-Present)&#10;- Developed responsive web apps..." oninput="updatePreview()" class="w-full p-2 border rounded text-sm"></textarea>
                </div>

                <div class="space-y-3">
                    <h2 class="text-lg font-bold border-b pb-1 text-slate-700">Projects</h2>
                    <textarea id="resProjects" rows="3" placeholder="e.g., E-commerce Platform: Built using HTML, CSS, JS..." oninput="updatePreview()" class="w-full p-2 border rounded text-sm"></textarea>
                </div>

                <div class="space-y-3">
                    <h2 class="text-lg font-bold border-b pb-1 text-slate-700">Certifications</h2>
                    <textarea id="resCertifications" rows="2" placeholder="e.g., Full Stack Web Development - Certification Name" oninput="updatePreview()" class="w-full p-2 border rounded text-sm"></textarea>
                </div>
            </div>

            <!-- APPLICATION FORM -->
            <div id="form-app" class="space-y-6 hidden">
                <div class="space-y-3">
                    <h2 class="text-lg font-bold border-b pb-1 text-slate-700">Application Details</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Application Type</label>
                            <select id="appType" onchange="updatePreview()" class="w-full p-2 border rounded text-sm bg-white">
                                <option value="Job Application">Job Application</option>
                                <option value="Leave Application">Leave Application</option>
                                <option value="Internship Request">Internship Request</option>
                                <option value="Resignation Letter">Resignation Letter</option>
                            </select>
                        </div>
                        <input type="text" id="appName" placeholder="Your Name" oninput="updatePreview()" class="p-2 border rounded text-sm mt-5">
                        <input type="text" id="appRecipient" placeholder="Recipient (e.g., The HR Manager)" oninput="updatePreview()" class="p-2 border rounded text-sm">
                        <input type="text" id="appCompany" placeholder="Company / Institute Name" oninput="updatePreview()" class="p-2 border rounded text-sm">
                        <input type="text" id="appSubject" placeholder="Subject" oninput="updatePreview()" class="p-2 border rounded text-sm md:col-span-2">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Body / Content</label>
                        <textarea id="appBody" rows="8" placeholder="Write your application body here..." oninput="updatePreview()" class="w-full p-2 border rounded text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Signature Upload</label>
                        <input type="file" id="appSignature" accept="image/*" onchange="handleImageUpload(event, 'signature')" class="text-xs">
                    </div>
                </div>
            </div>

        </section>

        <!-- Preview Section -->
        <section class="flex justify-center items-start">
            <div id="preview-paper" class="preview-paper print-area bg-white p-8 rounded shadow-lg border border-slate-300 transition-all flex flex-col justify-between">
                <!-- Dynamic Content Will Render Here -->
                <div id="preview-content"></div>
            </div>
        </section>

    </main>

    <!-- JavaScript -->
    <script>
        let currentTool = 'resume';
        let photoBase64 = '';
        let signatureBase64 = '';

        function switchTool(tool) {
            currentTool = tool;
            document.getElementById('form-resume').classList.toggle('hidden', tool !== 'resume');
            document.getElementById('form-app').classList.toggle('hidden', tool !== 'app');
            
            document.getElementById('btn-resume').className = tool === 'resume' ? 'px-4 py-2 rounded-md font-semibold text-sm bg-white shadow-sm text-slate-800' : 'px-4 py-2 rounded-md font-semibold text-sm text-slate-600 hover:text-slate-900';
            document.getElementById('btn-app').className = tool === 'app' ? 'px-4 py-2 rounded-md font-semibold text-sm bg-white shadow-sm text-slate-800' : 'px-4 py-2 rounded-md font-semibold text-sm text-slate-600 hover:text-slate-900';

            updatePreview();
        }

        function handleImageUpload(event, type) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (type === 'photo') photoBase64 = e.target.result;
                    if (type === 'signature') signatureBase64 = e.target.result;
                    updatePreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function updatePreview() {
            const color = document.getElementById('accentColor').value;
            const container = document.getElementById('preview-content');

            if (currentTool === 'resume') {
                const name = document.getElementById('resName').value || 'Your Name';
                const title = document.getElementById('resTitle').value || 'Professional Title';
                const email = document.getElementById('resEmail').value || 'email@example.com';
                const phone = document.getElementById('resPhone').value || '+1234567890';
                const location = document.getElementById('resLocation').value || 'City, Country';
                const education = document.getElementById('resEducation').value;
                const experience = document.getElementById('resExperience').value;
                const projects = document.getElementById('resProjects').value;
                const certifications = document.getElementById('resCertifications').value;

                container.innerHTML = `
                    <div class="border-b-4 pb-4 mb-6 flex justify-between items-center" style="border-color: ${color}">
                        <div>
                            <h1 class="text-3xl font-bold uppercase tracking-wider" style="color: ${color}">${name}</h1>
                            <p class="text-md font-medium text-slate-600">${title}</p>
                            <div class="text-xs text-slate-500 mt-2 space-x-2">
                                <span>${email}</span> • <span>${phone}</span> • <span>${location}</span>
                            </div>
                        </div>
                        ${photoBase64 ? `<img src="${photoBase64}" class="w-24 h-24 rounded-full object-cover border-2" style="border-color:${color}">` : ''}
                    </div>

                    <div class="space-y-5 text-sm">
                        ${education ? `
                        <div>
                            <h2 class="font-bold uppercase text-xs tracking-wider mb-1" style="color: ${color}">Education</h2>
                            <p class="whitespace-pre-line text-slate-700">${education}</p>
                        </div>` : ''}

                        ${experience ? `
                        <div>
                            <h2 class="font-bold uppercase text-xs tracking-wider mb-1" style="color: ${color}">Experience</h2>
                            <p class="whitespace-pre-line text-slate-700">${experience}</p>
                        </div>` : ''}

                        ${projects ? `
                        <div>
                            <h2 class="font-bold uppercase text-xs tracking-wider mb-1" style="color: ${color}">Projects</h2>
                            <p class="whitespace-pre-line text-slate-700">${projects}</p>
                        </div>` : ''}

                        ${certifications ? `
                        <div>
                            <h2 class="font-bold uppercase text-xs tracking-wider mb-1" style="color: ${color}">Certifications</h2>
                            <p class="whitespace-pre-line text-slate-700">${certifications}</p>
                        </div>` : ''}
                    </div>
                `;
            } else {
                const type = document.getElementById('appType').value;
                const name = document.getElementById('appName').value || 'Your Name';
                const recipient = document.getElementById('appRecipient').value || 'Recipient Title';
                const company = document.getElementById('appCompany').value || 'Company/Institute Name';
                const subject = document.getElementById('appSubject').value || 'Application Subject';
                const body = document.getElementById('appBody').value || 'Application body text goes here...';
                const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

                container.innerHTML = `
                    <div class="space-y-6 text-sm text-slate-800">
                        <div class="flex justify-between items-start border-b pb-4" style="border-color: ${color}">
                            <div>
                                <h1 class="text-xl font-bold" style="color: ${color}">${type}</h1>
                                <p class="text-xs text-slate-500">${today}</p>
                            </div>
                        </div>

                        <div>
                            <p class="font-semibold">${recipient}</p>
                            <p class="text-slate-600">${company}</p>
                        </div>

                        <div>
                            <p class="font-bold" style="color: ${color}">Subject: <span class="underline">${subject}</span></p>
                        </div>

                        <div class="whitespace-pre-line leading-relaxed text-slate-700 min-h-[200px]">
                            ${body}
                        </div>

                        <div class="pt-6">
                            <p>Sincerely,</p>
                            ${signatureBase64 ? `<img src="${signatureBase64}" class="h-12 my-2 object-contain">` : '<div class="h-10"></div>'}
                            <p class="font-bold" style="color: ${color}">${name}</p>
                        </div>
                    </div>
                `;
            }

            autoSaveData();
        }

        function autoSaveData() {
            const data = getFormData();
            localStorage.setItem('samar_toolkit_data', JSON.stringify(data));
        }

        function getFormData() {
            return {
                accentColor: document.getElementById('accentColor').value,
                resName: document.getElementById('resName').value,
                resTitle: document.getElementById('resTitle').value,
                resEmail: document.getElementById('resEmail').value,
                resPhone: document.getElementById('resPhone').value,
                resLocation: document.getElementById('resLocation').value,
                resEducation: document.getElementById('resEducation').value,
                resExperience: document.getElementById('resExperience').value,
                resProjects: document.getElementById('resProjects').value,
                resCertifications: document.getElementById('resCertifications').value,
                appType: document.getElementById('appType').value,
                appName: document.getElementById('appName').value,
                appRecipient: document.getElementById('appRecipient').value,
                appCompany: document.getElementById('appCompany').value,
                appSubject: document.getElementById('appSubject').value,
                appBody: document.getElementById('appBody').value,
                photoBase64,
                signatureBase64
            };
        }

        function loadData() {
            const saved = localStorage.getItem('samar_toolkit_data');
            if (saved) {
                applyDataToForm(JSON.parse(saved));
            } else {
                updatePreview();
            }
        }

        function applyDataToForm(data) {
            document.getElementById('accentColor').value = data.accentColor || '#4f46e5';
            document.getElementById('resName').value = data.resName || '';
            document.getElementById('resTitle').value = data.resTitle || '';
            document.getElementById('resEmail').value = data.resEmail || '';
            document.getElementById('resPhone').value = data.resPhone || '';
            document.getElementById('resLocation').value = data.resLocation || '';
            document.getElementById('resEducation').value = data.resEducation || '';
            document.getElementById('resExperience').value = data.resExperience || '';
            document.getElementById('resProjects').value = data.resProjects || '';
            document.getElementById('resCertifications').value = data.resCertifications || '';
            document.getElementById('appType').value = data.appType || 'Job Application';
            document.getElementById('appName').value = data.appName || '';
            document.getElementById('appRecipient').value = data.appRecipient || '';
            document.getElementById('appCompany').value = data.appCompany || '';
            document.getElementById('appSubject').value = data.appSubject || '';
            document.getElementById('appBody').value = data.appBody || '';
            photoBase64 = data.photoBase64 || '';
            signatureBase64 = data.signatureBase64 || '';
            updatePreview();
        }

        function clearData() {
            if (confirm('Kya aap saara data clear karna chahte hain?')) {
                localStorage.removeItem('samar_toolkit_data');
                photoBase64 = '';
                signatureBase64 = '';
                document.querySelectorAll('input[type="text"], input[type="email"], textarea').forEach(i => i.value = '');
                document.querySelectorAll('input[type="file"]').forEach(i => i.value = '');
                updatePreview();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(getFormData()));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "SamAr_Career_Toolkit_Backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        applyDataToForm(importedData);
                        alert('Data successfully import ho gaya hai!');
                    } catch (err) {
                        alert('Invalid JSON File!');
                    }
                };
                reader.readAsText(file);
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
